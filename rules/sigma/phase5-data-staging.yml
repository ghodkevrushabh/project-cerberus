title: Archive Utility Executed From a Temporary Directory
id: 6b3a8d70-cerberus-phase5
status: experimental
description: >
  Detects an archive utility (7-Zip, WinRAR, RAR) launched with its working
  directory inside a temp folder — a combination indicative of data staging
  ahead of exfiltration. Neither signal alone (archive tool usage, or temp
  directory activity) is unusual; the combination is the meaningful indicator.
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\7z.exe'
      - '\winrar.exe'
      - '\rar.exe'
  selection_path:
    CurrentDirectory|contains: '\temp\'
  condition: selection_image and selection_path
falsepositives:
  - Legitimate software installers that stage and extract archives in temp directories during setup
  - IT automation/deployment scripts using archive tools against temp working directories
level: high
tags:
  - attack.collection
  - attack.t1560
